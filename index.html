<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="bg-black min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">

        <div class="text-white text-right mb-6 px-4">
            <div class="text-gray-400 text-3xl font-light mb-2" id="expression">1333</div>
            <div class="text-7xl font-light" id="display">0.7734</div>
        </div>

        <div class="grid grid-cols-4 gap-3 px-4">
            
            <button class="aspect-square rounded-full bg-gray-600 text-white text-3xl font-light transition-opacity active:opacity-50 select-none flex items-center justify-center" data-action="backspace">
                <i class="fa-solid fa-delete-left text-white"></i>
            </button>
            <button class="aspect-square rounded-full bg-gray-600 text-white text-3xl font-light transition-opacity active:opacity-50 select-none" data-action="clear">AC</button>
            <button class="aspect-square rounded-full bg-gray-600 text-white text-3xl font-light transition-opacity active:opacity-50 select-none" data-action="percent">%</button>
            <button class="aspect-square rounded-full bg-orange-500 text-white text-4xl font-light transition-opacity active:opacity-50 select-none" data-action="divide">÷</button>

            
            <button class="aspect-square rounded-full bg-gray-700 text-white text-4xl font-light transition-opacity active:opacity-50 select-none" data-number="7">7</button>
            <button class="aspect-square rounded-full bg-gray-700 text-white text-4xl font-light transition-opacity active:opacity-50 select-none" data-number="8">8</button>
            <button class="aspect-square rounded-full bg-gray-700 text-white text-4xl font-light transition-opacity active:opacity-50 select-none" data-number="9">9</button>
            <button class="aspect-square rounded-full bg-orange-500 text-white text-4xl font-light transition-opacity active:opacity-50 select-none" data-action="multiply">x</button>

           
            <button class="aspect-square rounded-full bg-gray-700 text-white text-4xl font-light transition-opacity active:opacity-50 select-none" data-number="4">4</button>
            <button class="aspect-square rounded-full bg-gray-700 text-white text-4xl font-light transition-opacity active:opacity-50 select-none" data-number="5">5</button>
            <button class="aspect-square rounded-full bg-gray-700 text-white text-4xl font-light transition-opacity active:opacity-50 select-none" data-number="6">6</button>
            <button class="aspect-square rounded-full bg-orange-500 text-white text-4xl font-light transition-opacity active:opacity-50 select-none" data-action="subtract">-</button>

           
            <button class="aspect-square rounded-full bg-gray-700 text-white text-4xl font-light transition-opacity active:opacity-50 select-none" data-number="1">1</button>
            <button class="aspect-square rounded-full bg-gray-700 text-white text-4xl font-light transition-opacity active:opacity-50 select-none" data-number="2">2</button>
            <button class="aspect-square rounded-full bg-gray-700 text-white text-4xl font-light transition-opacity active:opacity-50 select-none" data-number="3">3</button>
            <button class="aspect-square rounded-full bg-orange-500 text-white text-4xl font-light transition-opacity active:opacity-50 select-none" data-action="add">+</button>

            
            <button class="aspect-square rounded-full bg-gray-700 text-white text-3xl font-light transition-opacity active:opacity-50 select-none" data-action="toggle-sign">+/-</button>
            <button class="aspect-square rounded-full bg-gray-700 text-white text-4xl font-light transition-opacity active:opacity-50 select-none" data-number="0">0</button>
            <button class="aspect-square rounded-full bg-gray-700 text-white text-4xl font-light transition-opacity active:opacity-50 select-none" data-action="decimal">.</button>
            <button class="aspect-square rounded-full bg-orange-500 text-white text-4xl font-light transition-opacity active:opacity-50 select-none" data-action="equals">=</button>
        </div>
    </div>

    
</body>
</html>
